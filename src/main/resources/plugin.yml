name: AxClans
description: $description
prefix: AxClans
version: '${version}'

main: de.jaunikapauni.axclans.AxClans
api-version: '26.1.2'
load: POSTWORLD

authors: [ JauniKapauni ]
website: https://github.com/JauniKapauni

softdepend:
  - PlaceholderAPI

depend:
  - AxEconomy

commands:
  create:
    usage: /create <name>
    description: Create a clan
  delete:
    usage: /remove <name>
    description: Remove a clan
  join:
    usage: /join <name>
    description: Join a clan
  leave:
    usage: /leave <name>
    description: Leave a clan
  accept:
    usage: /accept <name>
    description: Accept a player to the clan
  deny:
    usage: /deny <name>
    description: Deny a player to the clan